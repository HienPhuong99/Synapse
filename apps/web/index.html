<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Synapse — Project Thread Observer</title>
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('synapse-glass-theme');
        } catch (e) {}
        if (!t || t === 'auto') {
          t = 'light';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', t);
        root.classList.toggle('dark', t === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#0b0d10' : '#f8f9fb');

        var c;
        try {
          c = localStorage.getItem('synapse-glass-clear');
        } catch (e) {}
        if (c === null || isNaN(+c)) c = 45;
        root.style.setProperty('--clear', (Math.max(0, Math.min(100, +c)) / 100).toFixed(2));
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
